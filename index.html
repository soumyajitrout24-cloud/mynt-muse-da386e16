<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>Mynt Girlfriend | Luxury Model Representation Agency in India</title>

    <meta
      name="description"
      content="Mynt Girlfriend is a luxury model representation agency in India, curating elite talent for corporate events, brand campaigns, photoshoots, and exclusive occasions."
    />

    <meta
      name="author"
      content="MYNT Girlfriend"
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large"
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://www.myntgirlfriend.in/"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/logoo.png"
    />

    <link
      rel="apple-touch-icon"
      href="/logoo.png"
    />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta
      property="og:title"
      content="Mynt Girlfriend | Luxury Model Representation Agency in India"
    />

    <meta
      property="og:description"
      content="Discover Mynt Girlfriend, India's luxury model representation agency for corporate events, brand campaigns, photoshoots, and exclusive occasions."
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://www.myntgirlfriend.in/"
    />

    <meta
      property="og:site_name"
      content="MYNT Girlfriend"
    />

    <meta
      property="og:image"
      content="https://www.myntgirlfriend.in/logoo.png"
    />

    <meta
      property="og:image:alt"
      content="MYNT Girlfriend"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Mynt Girlfriend | Luxury Model Representation Agency in India"
    />

    <meta
      name="twitter:description"
      content="India's luxury model representation agency for corporate events, brand campaigns, photoshoots, and exclusive occasions."
    />

    <meta
      name="twitter:image"
      content="https://www.myntgirlfriend.in/logoo.png"
    />

    <meta
      name="twitter:image:alt"
      content="MYNT Girlfriend"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
